[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-acras-project"
version = "0.1.0"
description = "ACRAS data extraction for helicopter detection and classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
storage = ["pyarrow>=14"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
