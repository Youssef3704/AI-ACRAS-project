services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: acras
      POSTGRES_USER: acras
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acras}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - acras_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acras -d acras"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acras_postgres_data:
